<!DOCTYPE html>
<html>
<head>
    <title>Cadastro de Alunos</title>
</head>
<body>

    <h1>Alunos</h1>

    <form action="/adicionar" method="post">
        <input name="nome" placeholder="Nome do aluno">
        <button>Adicionar</button>
    </form>

    <ul>
    {% for aluno in alunos %}
        <li>{{ aluno }}</li>
    {% endfor %}
    </ul>

</body>
</html>
